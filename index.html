<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STEAMNEW — магазин игр</title>
<style>
/* ===== Переменные цветов ===== */
:root{--bg:#0b1220;--bg2:#12203a;--panel:rgba(24,38,64,.55);--line:rgba(120,190,255,.16);--txt:#e6f1ff;--dim:#8fa6c4;
--cyan:#38e1ff;--green:#5cff9d;--red:#ff4d6d;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
/* Анимированный градиентный фон (только transform) */
.bg{position:fixed;inset:-25%;z-index:-2;background:radial-gradient(circle at 20% 30%,var(--b1,#1b4fa0) 0,transparent 40%),radial-gradient(circle at 80% 20%,var(--b2,#0f7a6a) 0,transparent 38%),radial-gradient(circle at 60% 85%,var(--b3,#3a1f7a) 0,transparent 42%);opacity:.55;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(6%,4%,0) rotate(8deg) scale(1.1)}}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
#glow{position:fixed;left:0;top:0;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;background:radial-gradient(circle,rgba(56,225,255,.16),transparent 65%);pointer-events:none;z-index:0;will-change:transform}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 24px rgba(56,225,255,.04)}
/* ===== Шапка ===== */
header{position:sticky;top:0;z-index:50;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(9,15,28,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1200px;margin:auto}
.logo{font-weight:900;font-size:24px;letter-spacing:2px;position:relative;cursor:pointer;color:var(--cyan);text-shadow:0 0 12px var(--cyan);user-select:none}
.logo::before,.logo::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:.8}
.logo::before{color:var(--green);animation:gl1 3s infinite steps(1)}
.logo::after{color:var(--red);animation:gl2 3s infinite steps(1)}
@keyframes gl1{0%,90%,100%{transform:none;opacity:0}92%{transform:translate3d(-3px,1px,0);opacity:.8}96%{transform:translate3d(2px,-1px,0);opacity:.8}}
@keyframes gl2{0%,91%,100%{transform:none;opacity:0}93%{transform:translate3d(3px,-1px,0);opacity:.8}97%{transform:translate3d(-2px,1px,0);opacity:.8}}
.sw{flex:1;position:relative;min-width:0}
#q{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(8,14,26,.7);padding:0 14px;outline:none}
#q:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.18)}
#sug{position:absolute;left:0;right:0;top:50px;overflow:hidden;display:none;z-index:60}
#sug div{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#sug div:hover{background:rgba(56,225,255,.12)}
.ib{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:20px;display:grid;place-items:center;overflow:hidden}
.ib b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--green);color:#03150b;font-size:12px;display:grid;place-items:center;transition:transform .3s}
.ib b.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.6)}}
nav{display:flex;gap:8px;overflow-x:auto;max-width:1200px;margin:10px auto 0;scrollbar-width:none;padding-bottom:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--dim);transition:transform .2s,color .2s,background .2s}
nav button.on{color:#04121c;background:linear-gradient(90deg,var(--cyan),var(--green));border-color:transparent;font-weight:700}
/* кнопки + ripple */
.btn{position:relative;overflow:hidden;min-height:44px;padding:0 20px;border-radius:12px;border:0;cursor:pointer;font-weight:700;color:#03140d;background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 18px rgba(92,255,157,.3);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.g{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* ===== Основа ===== */
main{max-width:1200px;margin:auto;padding:16px 14px 60px;position:relative;z-index:1}
h2{font-size:22px;margin:22px 0 12px}
.view{animation:vin .45s ease both}
@keyframes vin{from{opacity:0;transform:translate3d(0,14px,0)}}
.rv{opacity:0;transform:translate3d(0,26px,0);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
/* Hero */
.hero{position:relative;height:clamp(240px,46vw,400px);overflow:hidden;cursor:pointer}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide .art{position:absolute;inset:-6%;transition:transform .2s linear}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 18px 30px;background:linear-gradient(transparent,rgba(5,10,20,.92))}
.slide h3{font-size:clamp(24px,5vw,44px);text-shadow:0 0 20px rgba(0,0,0,.6)}
.slide p{color:var(--dim);margin:6px 0 12px;max-width:560px}
.prog{position:absolute;left:0;bottom:0;height:4px;width:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transform-origin:left;transform:scaleX(0);z-index:3}
.dots{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:3}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
/* Фильтры */
.flt{display:flex;flex-wrap:wrap;gap:10px;padding:12px;margin-top:16px;align-items:center}
.flt select,.flt input[type=range]{height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(8,14,26,.7);padding:0 10px}
.flt label{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:4px;flex:1 1 140px}
.flt input[type=range]{padding:0;accent-color:var(--cyan)}
/* Сетка карточек */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;overflow:hidden;cursor:pointer;transform-style:preserve-3d;will-change:transform;transition:transform .25s ease,box-shadow .25s}
.card:hover{box-shadow:0 0 26px rgba(56,225,255,.28)}
.card .thumb{position:relative;height:130px;overflow:hidden}
.art{background-size:cover;display:grid;place-items:center;font-size:54px}
.pv{position:absolute;inset:0;opacity:0;transition:opacity .4s}
.card:hover .pv{opacity:1}
.pv i{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.pv i.on{opacity:1}
.shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 45%);opacity:0;transition:opacity .25s;z-index:2}
.card:hover .shine{opacity:1}
.info{padding:12px}
.info h4{font-size:16px;margin-bottom:4px}
.tags{font-size:12px;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.price{display:flex;align-items:center;gap:6px;font-weight:700}
.price s{color:var(--dim);font-weight:400;font-size:13px}
.badge{padding:4px 8px;border-radius:8px;background:#0a2a12;color:var(--green);border:1px solid var(--green);box-shadow:0 0 10px rgba(92,255,157,.5);font-weight:800;font-size:13px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 18px var(--green)}}
.mini{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(8,14,26,.6);cursor:pointer;font-size:18px;position:relative;overflow:hidden}
.mini.on{color:var(--red);border-color:var(--red)}
.rate{position:absolute;top:8px;left:8px;z-index:3;background:rgba(5,10,20,.7);padding:3px 8px;border-radius:8px;font-size:12px;color:var(--cyan)}
.timer{font-variant-numeric:tabular-nums;color:var(--red);font-weight:700}
/* Скелетон */
.sk{height:250px;border-radius:var(--r);background:linear-gradient(90deg,#14223c 25%,#1d3157 50%,#14223c 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
/* Страница игры */
.gp{display:grid;gap:16px;grid-template-columns:1.3fr 1fr}
.gp .art{height:min(56vw,340px);border-radius:var(--r);font-size:110px}
.box{padding:16px;margin-bottom:14px}
.box li{margin:6px 0 6px 18px;color:var(--dim)}
.rev{padding:10px 0;border-bottom:1px solid var(--line)}
.chip{display:inline-block;padding:4px 10px;border-radius:14px;background:rgba(56,225,255,.12);border:1px solid var(--line);margin:0 6px 6px 0;font-size:12px}
/* Корзина / новости */
.line{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.line .art{width:64px;height:64px;border-radius:12px;font-size:28px;flex:none}
.line>div:nth-child(2){flex:1;min-width:0}
.sum{padding:16px;margin-top:14px;display:grid;gap:6px}
.news{padding:16px;margin-bottom:12px}
.news small{color:var(--cyan)}
.empty{padding:40px 16px;text-align:center;color:var(--dim)}
/* Toast */
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{padding:12px 18px;border-radius:12px;background:rgba(10,20,38,.94);border:1px solid var(--cyan);box-shadow:0 0 18px rgba(56,225,255,.35);animation:tin .35s ease both}
.toast.err{border-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translate3d(0,20px,0)}}
.fly{position:fixed;z-index:300;border-radius:12px;pointer-events:none;will-change:transform,opacity}
@media(max-width:720px){.gp{grid-template-columns:1fr}.logo{font-size:19px}h2{font-size:19px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}}
/* Аккаунт */
#me{display:flex;align-items:center;gap:8px;flex:none}
.sm{min-height:44px;padding:0 14px}
.nick{font-weight:800;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh{display:none}
#auth{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:rgba(6,10,20,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#auth[hidden]{display:none}
#af{width:100%;max-width:360px;display:grid;gap:12px;padding:22px;animation:vin .35s ease both}
#af input{height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(8,14,26,.8);padding:0 14px;outline:none}
#af input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.18)}
#af input[hidden]{display:none}
#af small{color:var(--red);min-height:16px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--dim)}
.tabs button.on{color:#04121c;background:linear-gradient(90deg,var(--cyan),var(--green));border-color:transparent;font-weight:700}
#ckb{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:520px;margin:auto;z-index:190;padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:14px}
#ckb[hidden]{display:none}
@media(max-width:720px){.top{flex-wrap:wrap}.logo{flex:1}.sw{order:5;flex-basis:100%}.lg{display:none}.sh{display:inline}.nick{max-width:70px}}
/* Владелец, валюта */
#cur{width:56px;padding:0 4px;font-size:16px;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;color:var(--txt)}
#cur option{background:#0b1220}
.fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.fr input:not([type=checkbox]),.ar select{flex:1 1 130px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(8,14,26,.7);padding:0 10px;outline:none;min-width:0}
.fr input[type=file]{padding:9px 10px}
.ar{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ar>span:first-child,.ar>b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ar select{flex:0 1 120px;height:40px}
/* Аватары и профиль */
.av{display:inline-grid;place-items:center;border-radius:50%;border:2px solid var(--cyan);background-size:cover;background-position:center;font-weight:800;color:#fff;flex:none;overflow:hidden}
.pfb{background:none;border:0;cursor:pointer;padding:0;display:flex;border-radius:50%;min-width:44px;min-height:44px;align-items:center;justify-content:center}
#prof{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:rgba(6,10,20,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto}
#prof[hidden]{display:none}
#pbox{width:100%;max-width:380px;display:grid;gap:12px;padding:22px;text-align:center;justify-items:center;animation:vin .35s ease both}
#pform{display:grid;gap:10px;width:100%}
#pform input{height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(8,14,26,.8);padding:0 14px;outline:none}
#pform input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.18)}
#pe2{color:var(--red);min-height:16px}
@media(max-width:720px){.nick{display:none}}
/* Фон, оформление, структура */
.bgimg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
.bgimg.on{opacity:1}
#look{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:rgba(6,10,20,.6);overflow-y:auto}
#look[hidden]{display:none}
#lbox{width:100%;max-width:380px;display:grid;gap:14px;padding:22px;text-align:center;animation:vin .35s ease both}
#lbody{display:grid;gap:14px}
#lbody label{display:flex;gap:8px;align-items:center;justify-content:center}
.pre{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.pre.on{border-color:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.org{border-left:3px solid var(--c);padding:10px 14px;margin:0 0 10px calc(var(--l)*14px)}
.org b{color:var(--c)}
.org .chip{margin:6px 6px 0 0}
/* Кошелёк, обложки, переходы, игры */
.wal{font-weight:700;color:var(--green);white-space:nowrap;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:0 10px;height:44px;display:flex;align-items:center;background:var(--panel)}
.card .thumb{height:auto;aspect-ratio:460/215}
.thumb>.art{position:absolute;inset:0;height:100%!important}
.cov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.view.out{animation:none;opacity:0;transform:translate3d(0,-8px,0);transition:opacity .18s ease,transform .18s ease}
.ar{flex-wrap:wrap}
#gm{position:fixed;inset:0;z-index:600;background:#060a14;display:flex;flex-direction:column}
#gm[hidden]{display:none}
#gtop{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px}
#gc{display:block;flex:none;touch-action:none}
#gres{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px;text-align:center;min-width:260px}
#gres[hidden]{display:none}
/* Пониженная анимация */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}#glow,#fx{display:none}}
</style>
</head>
<body>
<div class="bg"></div><div class="bgimg" id="bgimg"></div><canvas id="fx"></canvas><div id="glow"></div>
<header>
  <div class="top">
    <div class="logo" data-t="STEAMNEW" id="logo">STEAMNEW</div>
    <div class="sw"><input id="q" placeholder="Поиск игр…" autocomplete="off"><div id="sug" class="glass"></div></div>
    <button class="ib" id="wbtn" aria-label="Желаемое">♥<b id="wc">0</b></button>
    <button class="ib" id="cbtn" aria-label="Корзина">🛒<b id="cc">0</b></button>
    <button class="ib" id="lbtn" aria-label="Оформление">🎨</button>
    <select id="cur" class="ib" aria-label="Валюта"></select>
    <div id="me"></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="toasts"></div>
<div id="auth" hidden><form class="glass" id="af" autocomplete="off"><div class="tabs"><button type="button" data-m="in" class="on">Вход</button><button type="button" data-m="up">Регистрация</button></div>
<input id="an" placeholder="Ник" autocomplete="username" maxlength="16"><input id="ap" type="password" placeholder="Пароль" autocomplete="current-password"><input id="ap2" type="password" placeholder="Повторите пароль" autocomplete="new-password" hidden>
<small id="ae"></small><button class="btn" type="submit" id="asub">Войти</button><button type="button" class="btn g" id="acl">Закрыть</button></form></div>
<div id="prof" hidden><div class="glass" id="pbox"><div id="pav"></div><div id="pnm"></div>
<div class="fr" style="justify-content:center;margin:0"><label class="btn" style="display:grid;place-items:center">Загрузить фото<input id="pfile" type="file" accept="image/*" hidden></label><button class="btn g" type="button" id="prm">Убрать фото</button></div>
<form id="pform" autocomplete="off"><h3>Сменить пароль</h3><input id="pcur" type="password" placeholder="Текущий пароль" autocomplete="current-password"><input id="pnew" type="password" placeholder="Новый пароль (любой)" autocomplete="new-password"><input id="pnew2" type="password" placeholder="Повторите новый пароль" autocomplete="new-password"><small id="pe2"></small><button class="btn" type="submit">Сохранить пароль</button></form>
<button class="btn g" type="button" id="pcl" style="width:100%">Закрыть</button></div></div>
<div id="look" hidden><div class="glass" id="lbox"><h3>Оформление сайта</h3><div id="lbody"></div><button class="btn g" type="button" id="lcl" style="width:100%">Закрыть</button></div></div>
<div id="gm" hidden><div id="gtop"><b id="gt"></b><span id="ghud"></span><button class="btn g sm" id="gx">✕ Выйти</button></div><canvas id="gc"></canvas><div id="gres" class="glass" hidden></div></div>
<div id="ckb" class="glass" hidden><span>🍪 Мы используем cookie, чтобы помнить ваш вход.</span><button class="btn sm" id="cka">Принять</button></div>

<script>
/* ===== Данные игр (арт — CSS-градиенты и эмодзи, без картинок) ===== */
let G=[
["Нео-Гонщик","Гонки",1299,30,4.6,"2026-09-10","🏎️",200,320,"Гонки по неоновым городам будущего с дрифтом и ночным дождём.",["Аркада","Онлайн","Музыка"],38200],
["Тени Вальхаллы","Экшен",2499,50,4.8,"2026-08-01","⚔️",20,280,"Суровый северный мир, честные дуэли и огромные боссы.",["RPG","Открытый мир","Сложная"],91400],
["Космо-Ферма","Симулятор",599,0,4.4,"2026-09-20","🌱",130,60,"Выращивайте урожай на орбитальной станции и торгуйте с планетами.",["Уют","Кооператив","Крафт"],15800],
["Кибер-Детектив","Приключение",1799,25,4.7,"2026-09-25","🕵️",280,190,"Расследуйте дела в мегаполисе, где каждый свидетель может лгать.",["Детектив","Сюжет","Нуар"],27300],
["Башни Хаоса","Стратегия",899,60,4.3,"2026-06-15","🏰",40,250,"Стройте башни, комбинируйте заклинания, удержите ворота.",["Tower Defense","Тактика"],20100],

 addEventListener("keydown",key);
 cv.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};
 cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)};
 function draw(){x.fillStyle="#08101f";x.fillRect(0,0,cv.width,cv.height);x.fillStyle="#0d1a30";x.fillRect(ox,oy,c*N,c*N);x.fillStyle="#ff4d6d";x.fillRect(ox+f[0]*c+2,oy+f[1]*c+2,c-4,c-4);x.fillStyle="#5cff9d";s.forEach((q,i)=>{x.globalAlpha=i?.8:1;x.fillRect(ox+q[0]*c+1,oy+q[1]*c+1,c-2,c-2)});x.globalAlpha=1;hud.textContent="🍎 "+sc}
 function stop(){clearInterval(tm);removeEventListener("keydown",key)}
 function step(){d=nd;const h=[s[0][0]+d[0],s[0][1]+d[1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(q=>q[0]===h[0]&&q[1]===h[1])){stop();end(sc*3,"Съедено яблок: "+sc);return}
  s.unshift(h);if(h[0]===f[0]&&h[1]===f[1]){sc++;do f=[Math.random()*N|0,Math.random()*N|0];while(s.some(q=>q[0]===f[0]&&q[1]===f[1]))}else s.pop();draw()}
 tm=setInterval(step,130);draw();return stop}
function tir(cv,hud,end){const x=cv.getContext("2d"),W=cv.width,H=cv.height;let T=[],sc=0,left=30,run=true,last=performance.now(),sp=0;
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;for(let i=T.length;i--;)if(Math.hypot(T[i].x-px,T[i].y-py)<T[i].r+8){T.splice(i,1);sc++;break}};
 (function loop(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;left-=dt;sp-=dt;
  if(sp<=0){T.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-80),r:22+Math.random()*18,l:1.3});sp=.45}
  for(const q of T)q.l-=dt;T=T.filter(q=>q.l>0);
  x.fillStyle="#08101f";x.fillRect(0,0,W,H);
  for(const q of T){x.strokeStyle="#ff4d6d";x.lineWidth=4;x.beginPath();x.arc(q.x,q.y,q.r*q.l/1.3+4,0,7);x.stroke();x.fillStyle="#ff4d6d";x.beginPath();x.arc(q.x,q.y,q.r*.4,0,7);x.fill()}
  hud.textContent="🎯 "+sc+"  ⏱ "+Math.max(0,left|0);
  if(left<=0){run=false;end(sc*4,"Попаданий: "+sc);return}
  requestAnimationFrame(loop)})(last);return()=>{run=false}}
renderMe();render();restore();
</script>
